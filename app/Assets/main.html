<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101426;font-family:Sora,system-ui,sans-serif;color:#e8ebf5;overflow:hidden}
#app{display:flex;width:100vw;height:100vh;min-width:0;min-height:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
a,.link{color:#45c4ff;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.muted{color:#6d7694}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.btn{border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:7px 12px;font:600 11.5px Sora,sans-serif;color:#a9b2cc;cursor:pointer;background:transparent}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{background:#45c4ff;color:#062033;border-color:transparent}
.btn.danger{border-color:rgba(255,109,109,.4);color:#ff8f8f}
input[type=text],textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#e8ebf5;font:400 12px Sora,sans-serif;padding:8px 10px;outline:none}
input[type=text]:focus,textarea:focus{border-color:rgba(69,196,255,.5)}
textarea{resize:vertical;font-family:Sora,sans-serif}
.chip{border-radius:6px;padding:2px 8px;font:600 10px Sora,sans-serif;display:inline-flex;align-items:center;gap:4px}
.chip.habit{background:rgba(255,77,148,.14);color:#ff9dc4}
.chip.adapt{background:rgba(61,220,132,.12);color:#7fe8ad}
.chip.workon{background:rgba(255,209,102,.12);color:#ffd166}
.chip.tech{background:rgba(139,108,255,.14);color:#c3b3ff}
.chip.win{background:rgba(61,220,132,.14);color:#7fe8ad}
.chip.loss{background:rgba(255,109,109,.14);color:#ff8f8f}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---- sidebar ---- */
.sidebar{width:312px;flex:none;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.07);background:#0c1020;min-height:0}
.brand{padding:14px 14px 10px}
.brand-row{display:flex;align-items:center;gap:8px}
.brand-title{font:800 13px Sora,sans-serif;letter-spacing:.03em}
.brand-title span{color:#ff4d94}
.rec-indicator{margin-left:auto;display:flex;align-items:center;gap:5px;font:600 10px Sora,sans-serif;color:#ff9dc4}
.focus-box{margin-top:10px;background:linear-gradient(120deg,rgba(255,77,148,.14),rgba(69,196,255,.1));border:1px solid rgba(255,77,148,.3);border-radius:10px;padding:9px 11px;cursor:pointer}
.focus-label{font:600 9.5px Sora,sans-serif;color:#ff9dc4;letter-spacing:.1em}
.focus-text{font:600 11.5px/1.45 Sora,sans-serif;color:#f0e6ee;margin-top:3px}
.search{margin-top:10px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 10px}
.search input{background:transparent;border:none;flex:1;padding:0;font:400 11.5px Sora,sans-serif;color:#e8ebf5}
.filter-row{margin-top:7px;display:flex;gap:7px}
.filter-row select{color-scheme:dark;flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#e8ebf5;font:400 11px Sora,sans-serif;padding:6px 7px;outline:none}
.filter-row select:focus{border-color:rgba(69,196,255,.5)}
.filter-row select.active{border-color:rgba(69,196,255,.6);background:rgba(69,196,255,.1)}
.filter-row select option{background:#181c30;color:#e8ebf5}
.match-list{flex:1;overflow-y:auto;min-height:0}
.match-row{padding:9px 14px;display:flex;flex-direction:column;gap:5px;border-left:2px solid transparent;cursor:pointer}
.match-row:hover{background:rgba(255,255,255,.03)}
.match-row.selected{background:rgba(255,77,148,.1);border-left-color:#ff4d94}
.match-row.live{background:rgba(255,77,148,.1);border-left-color:#ff4d94}
.match-top{display:flex;align-items:baseline;gap:6px}
.match-opp{font:600 12.5px Sora,sans-serif;color:#c6cde0}
.match-row.selected .match-opp,.match-row.live .match-opp{font-weight:700;color:#fff}
.match-meta{font:400 10.5px Sora,sans-serif;color:#6d7694}
.sidebar-foot{padding:9px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font:400 10.5px Sora,sans-serif;color:#6d7694}
.sidebar-foot .link{margin-left:auto;color:#a9b2cc}
.sidebar-foot .link + .link{margin-left:10px}

/* ---- main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.detail-hdr{padding:14px 20px 11px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:9px}
.detail-title-row{display:flex;align-items:center;gap:10px}
.detail-title{font:700 17px Sora,sans-serif}
.detail-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.editable-chip{border:1px dashed rgba(255,255,255,.22);border-radius:6px;padding:3px 9px;font:400 10.5px Sora,sans-serif;color:#6d7694;cursor:pointer}
.body{flex:1;display:flex;min-height:0}
.notes-col{flex:1.35;display:flex;flex-direction:column;padding:12px 20px 14px;gap:9px;min-width:0;overflow-y:auto}
.note{display:flex;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 12px}
.note-actions{margin-left:auto;display:flex;gap:8px;opacity:0;flex:none;align-self:flex-start}
.note:hover .note-actions{opacity:1}
.note-actions span{cursor:pointer;color:#6d7694;font-size:12px}
.note-actions span:hover{color:#e8ebf5}
.note-actions span.danger:hover{color:#ff8f8f}
.note-ts{font:700 11px ui-monospace,Consolas,monospace;color:#45c4ff;background:rgba(69,196,255,.12);border-radius:5px;padding:2px 7px;height:fit-content;flex:none;cursor:pointer}
.note-time{font:400 10px ui-monospace,Consolas,monospace;color:#6d7694;margin-left:6px}
.note-group{font:700 9.5px Sora,sans-serif;letter-spacing:.12em;color:#6d7694;margin-top:4px}
.note-body{font:400 12px/1.5 Sora,sans-serif;color:#d4daea;flex:1}
.chip.game{background:rgba(69,196,255,.12);color:#45c4ff}
.composer{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.composer-row{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(69,196,255,.35);border-radius:10px;padding:9px 12px}
.composer-row input{flex:1;background:transparent;border:none}
.quicktags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.quicktags .chip{cursor:pointer;border:1px solid transparent}
.quicktags .chip.active{border-color:currentColor}
.side-col{width:280px;flex:none;border-left:1px solid rgba(255,255,255,.07);padding:12px 16px 14px;display:flex;flex-direction:column;gap:11px;background:rgba(4,10,24,.35);overflow-y:auto}
.slabel{font:700 11px Sora,sans-serif;letter-spacing:.12em;color:#6d7694}
.stat-box{flex:1;background:rgba(255,255,255,.05);border-radius:9px;padding:8px 10px;text-align:center}
.stat-num{font:700 15px Sora,sans-serif}
.stat-lbl{font:400 9.5px Sora,sans-serif;color:#6d7694}
.habit-line{font:400 11px/1.5 Sora,sans-serif;color:#c6cde0;border-left:2px solid rgba(255,77,148,.5);padding-left:9px}
.plan-box{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.25);border-radius:9px;padding:8px 10px}
.plan-label{font:600 9.5px Sora,sans-serif;color:#7fe8ad;letter-spacing:.08em}
.plan-text{font:400 10.5px/1.5 Sora,sans-serif;color:#c6cde0;margin-top:3px;white-space:pre-wrap}
.empty{font:400 11.5px Sora,sans-serif;color:#6d7694;padding:20px;text-align:center}

/* ---- player page ---- */
.player-hdr{padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.player-who{padding:18px 20px 14px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,.07)}
.avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ff4d94,#8b6cff);display:flex;align-items:center;justify-content:center;font:800 20px Sora,sans-serif;color:#fff;flex:none}
.player-body{flex:1;display:flex;min-height:0;overflow:hidden}
.player-col{flex:1;padding:14px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-y:auto}
.player-col.left{border-right:1px solid rgba(255,255,255,.07)}
.set-row{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.set-row:hover{background:rgba(255,255,255,.07)}
.sbar-row{display:flex;align-items:center;gap:8px;font:400 10.5px Sora,sans-serif;color:#a9b2cc}
.sbar-name{width:90px;flex:none}
.sbar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.sbar-fill{height:100%}

/* ---- settings ---- */
.settings-body{flex:1;display:flex;min-height:0}
.settings-nav{width:170px;flex:none;padding:16px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid rgba(255,255,255,.07)}
.settings-nav div{padding:7px 10px;border-radius:8px;font:400 12px Sora,sans-serif;color:#8a93ad}
.settings-nav div.active{background:rgba(69,196,255,.12);font-weight:600;color:#7dd7ff}
.settings-main{flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font:600 12.5px Sora,sans-serif}
.field-hint{font:400 10.5px Sora,sans-serif;color:#6d7694}
.field input[type=text]{width:100%}
.toggle{display:flex;align-items:center;gap:12px}
.toggle-track{width:34px;height:19px;border-radius:10px;position:relative;flex:none;cursor:pointer}
.toggle-thumb{position:absolute;top:2px;width:15px;height:15px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S = { data: null };

function post(msg) {
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(msg));
}
window.onerror = function (message, source, lineno, colno, error) {
  post({ action: 'jsError', message: String(message), lineno, colno, stack: error && error.stack });
};
// Called as window.__applyState({...}) with a JS object literal spliced
// directly into the script text (see MainWindow.PushState) — not a JSON
// string, so no JSON.parse here.
window.__applyState = function (data) {
  try {
    S.data = data;
    render();
  } catch (err) {
    post({ action: 'jsError', message: 'applyState: ' + err.message, stack: err.stack });
  }
};

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const y = new Date(today); y.setDate(y.getDate() - 1);
  const yest = d.toDateString() === y.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return `Today ${time}`;
  if (yest) return `Yesterday ${time}`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
}
function initial(name) { return (name || '?').trim()[0]?.toUpperCase() || '?'; }
function resultLabel(m) {
  if (!m.result) return null;
  return { text: `${m.result} ${m.gamesWon}–${m.gamesLost}`, cls: m.result === 'W' ? 'win' : 'loss' };
}

// ---- preserve focus/selection of the active input across full re-renders ----
function withPreservedFocus(fn) {
  const el = document.activeElement;
  let saved = null;
  if (el && el.id && document.getElementById('app').contains(el)) {
    saved = { id: el.id, value: el.value, start: el.selectionStart, end: el.selectionEnd };
  }
  fn();
  if (saved) {
    const again = document.getElementById(saved.id);
    if (again) {
      again.focus();
      if (again.value === saved.value && again.setSelectionRange) {
        try { again.setSelectionRange(saved.start, saved.end); } catch { }
      }
    }
  }
}

function render() {
  withPreservedFocus(() => {
    const s = S.data;
    const app = document.getElementById('app');
    if (!s) { app.innerHTML = ''; return; }
    if (s.page === 'settings') app.innerHTML = renderSettings(s);
    else if (s.page === 'player') app.innerHTML = renderPlayer(s);
    else if (s.page === 'live') app.innerHTML = renderLive(s);
    else app.innerHTML = renderLibrary(s);
    wireCommon();
  });
}

function wireCommon() {
  document.querySelectorAll('[data-click]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.click;
      const arg = el.dataset.arg;
      handlers[action] && handlers[action](el, arg);
    });
  });
  document.querySelectorAll('[data-enter]').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handlers[el.dataset.enter] && handlers[el.dataset.enter](el);
      }
    });
  });
  document.querySelectorAll('[data-blur]').forEach(el => {
    el.addEventListener('blur', () => handlers[el.dataset.blur] && handlers[el.dataset.blur](el));
  });
  const filterEl = document.getElementById('filterInput');
  if (filterEl) filterEl.addEventListener('input', () => { ui.filter = filterEl.value; render(); });
  const stageEl = document.getElementById('filterStage');
  if (stageEl) stageEl.addEventListener('change', () => { ui.filterStage = stageEl.value; render(); });
  const charEl = document.getElementById('filterCharacter');
  if (charEl) charEl.addEventListener('change', () => { ui.filterCharacter = charEl.value; render(); });
}

const ui = { filter: '', filterStage: '', filterCharacter: '', selectedMatchId: null, activeTags: [], editingNoteId: null, editingTags: [],
  composerGame: null, editingGame: null }; // composerGame null = auto (live) / whole-match (vod)

// ================= LIBRARY (turn 2a) =================

function pickSelectedMatch(s, fromList) {
  const list = fromList || s.matches;
  if (ui.selectedMatchId) {
    const m = list.find(x => x.id === ui.selectedMatchId);
    if (m) return m;
  }
  return list[0] || null;
}

// Distinct values across all recorded matches, for the filter dropdowns —
// sorted so the list doesn't reshuffle as new matches come in.
function sortedUnique(values) {
  return [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function renderLibrary(s) {
  const allStages = sortedUnique(s.matches.flatMap(m => m.stages || []));
  const allCharacters = sortedUnique(s.matches.map(m => m.opponentCharacter));

  const filtered = s.matches.filter(m => {
    if (ui.filter) {
      const f = ui.filter.toLowerCase();
      if (!(m.opponent.toLowerCase().includes(f) || m.notes.some(n => n.text.toLowerCase().includes(f)))) return false;
    }
    if (ui.filterStage && !(m.stages || []).includes(ui.filterStage)) return false;
    if (ui.filterCharacter && m.opponentCharacter !== ui.filterCharacter) return false;
    return true;
  });
  // Selection follows the filtered list so the detail pane never shows a
  // match that's been filtered out of the sidebar.
  const selected = pickSelectedMatch(s, filtered);

  return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <span class="brand-title">PEAK<span>RECORDER</span></span>
        ${s.recording.phase === 'recording' ? `<span class="rec-indicator link" data-click="openLive" style="text-decoration:none"><span class="dot" style="background:#ff4d94;box-shadow:0 0 6px #ff4d94"></span>REC</span>` :
          s.recording.phase === 'striking' ? `<span class="rec-indicator link" data-click="openLive" style="text-decoration:none;color:#ffd166"><span class="dot" style="background:#ffd166;box-shadow:0 0 6px #ffd166"></span>MATCH FOUND</span>` : ''}
      </div>
      <div class="focus-box" data-click="editFocus">
        <div class="focus-label">THIS WEEK'S FOCUS</div>
        <div class="focus-text">${s.focusGoal ? esc(s.focusGoal) : '<span class="muted">Click to set a practice focus…</span>'}</div>
      </div>
      <div class="search"><input id="filterInput" type="text" placeholder="Filter opponent, note…" value="${esc(ui.filter)}"></div>
      <div class="filter-row">
        <select id="filterStage" class="${ui.filterStage ? 'active' : ''}">
          <option value="">Stage: any</option>
          ${allStages.map(st => `<option value="${esc(st)}" ${ui.filterStage === st ? 'selected' : ''}>${esc(st)}</option>`).join('')}
        </select>
        <select id="filterCharacter" class="${ui.filterCharacter ? 'active' : ''}">
          <option value="">Character: any</option>
          ${allCharacters.map(c => `<option value="${esc(c)}" ${ui.filterCharacter === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="match-list">
      ${filtered.length === 0 ? '<div class="empty">No matches match these filters.</div>' : filtered.map(m => matchRow(m, s, selected)).join('')}
    </div>
    <div class="sidebar-foot">
      <span>${filtered.length === s.matches.length ? `${s.matches.length} recordings` : `${filtered.length} of ${s.matches.length}`}</span>
      <span class="link" data-click="openSettings">Settings</span>
    </div>
  </div>
  <div class="main">${selected ? matchDetail(selected, s) : `<div class="empty">Select a match to see notes and scouting.</div>`}</div>
  `;
}

function matchRow(m, s, selected) {
  const live = !!s.recording.phase && s.recording.currentMatchRecordId === m.id;
  const sel = m === selected;
  const r = resultLabel(m);
  return `
  <div class="match-row ${live ? 'live' : (sel ? 'selected' : '')}" data-click="${live ? 'openLive' : 'selectMatch'}" data-arg="${m.id}">
    <div class="match-top">
      <span class="match-opp">${esc(m.opponent)}</span>
      ${live ? '<span style="margin-left:auto;font:700 10.5px Sora,sans-serif;color:#ff9dc4">LIVE</span>' :
        (r ? `<span class="chip ${r.cls}" style="margin-left:auto">${r.text}</span>` : '')}
    </div>
    <div class="match-meta">${fmtDate(m.startedAt)}${m.notes.length ? ` · ${m.notes.length} note${m.notes.length === 1 ? '' : 's'}` : ''}</div>
  </div>`;
}

function matchDetail(m, s) {
  const live = s.recording.isRecording && s.recording.currentMatchRecordId === m.id;
  const r = resultLabel(m);
  const stages = (m.stages || []).map(st => `<span class="chip" style="background:rgba(255,255,255,.07);color:#a9b2cc">${esc(st)}</span>`).join('');
  return `
  <div class="detail-hdr">
    <div class="detail-title-row">
      <div class="detail-title">vs <span class="link" style="color:inherit" title="open player page" data-click="openPlayer" data-arg="${esc(m.opponent)}">${esc(m.opponent)} <span style="color:#45c4ff;font-size:12px">↗</span></span></div>
      ${live ? '<span class="row" style="gap:6px;background:rgba(255,77,148,.14);color:#ff9dc4;border-radius:6px;padding:3px 9px;font:700 11px Sora,sans-serif"><span class="dot" style="background:#ff4d94"></span>RECORDING</span>'
             : (r ? `<span class="chip ${r.cls}" style="font-size:11px">${r.text}</span>` : '')}
      <div style="margin-left:auto;display:flex;gap:8px">
        ${live ? '<div class="btn danger" data-click="stopRecording">■ Stop</div>' : ''}
        ${m.videoPath ? '<div class="btn" data-click="openVideo" data-arg="' + m.id + '">Show file</div>' : ''}
        <div class="btn danger" data-click="deleteMatch" data-arg="${m.id}">Delete</div>
      </div>
    </div>
    <div class="detail-chips">
      ${stages}
      <span class="editable-chip" data-click="editMeta" data-arg="${m.id}">edit result / stages / characters</span>
      ${m.myCharacter ? `<span class="chip" style="background:rgba(255,77,148,.14);color:#ff9dc4">${esc(m.myCharacter)}</span>` : ''}
      ${m.opponentCharacter ? `<span class="chip" style="background:rgba(139,108,255,.16);color:#c3b3ff">${esc(m.opponentCharacter)}</span>` : ''}
    </div>
    <div id="metaEditor-${m.id}"></div>
  </div>
  <div class="body">
    <div class="notes-col">
      <div class="row" style="gap:8px"><span class="slabel">NOTES</span><span class="muted" style="font-size:10.5px">by game of the set</span></div>
      ${m.notes.length === 0 ? '<div class="empty">No notes yet.</div>' : notesList(m)}
      ${composer(m, live)}
    </div>
    <div class="side-col">${scoutingPanel(m.opponent, s)}</div>
  </div>`;
}

function noteRow(n) {
  if (ui.editingNoteId === n.id) return noteEditor(n);
  const tags = (n.tags || []).map(tagChip).join(' ');
  const time = n.timestampSeconds > 0 ? `<span class="note-time" title="into the recording">${fmtTime(n.timestampSeconds)}</span>` : '';
  const ts = n.gameNumber
    ? `<span class="note-ts">G${n.gameNumber}</span>`
    : n.timestampSeconds >= 0
      ? `<span class="note-ts" title="click to copy">${fmtTime(n.timestampSeconds)}</span>`
      : `<span class="note-ts" style="background:rgba(255,255,255,.06);color:#6d7694" title="added after the match">vod</span>`;
  return `<div class="note">${ts}<div class="note-body">${esc(stripInlineTags(n.text))} ${tags}${n.gameNumber ? time : ''}</div>
    <div class="note-actions">
      <span title="edit note" data-click="editNote" data-arg="${n.id}">✎</span>
      <span class="danger" title="delete note" data-click="deleteNote" data-arg="${n.id}">✕</span>
    </div></div>`;
}

// Notes come out of the store in creation order, so a set reads game by game;
// insert a small header whenever the game a note belongs to changes.
function notesList(m) {
  if (m.notes.length === 0) return '';
  if (!m.notes.some(n => n.gameNumber)) return m.notes.map(n => noteRow(n)).join('');
  let html = '';
  let last;
  for (const n of m.notes) {
    const g = n.gameNumber || null;
    if (g !== last) {
      const stage = g ? (m.stages || [])[g - 1] : null;
      html += `<div class="note-group">${g ? `GAME ${g}${stage ? ' · ' + esc(stage.toUpperCase()) : ''}` : 'WHOLE MATCH'}</div>`;
      last = g;
    }
    html += noteRow(n);
  }
  return html;
}

const TAG_CLASSES = { habit: 'habit', adapt: 'adapt', 'work-on': 'workon', tech: 'tech' };

// Tags written inline in the note text (e.g. "missed tech chase #habit") count
// as if the matching chip had been clicked, so typing the tag is enough.
function parseInlineTags(text) {
  const lower = (text || '').toLowerCase();
  return Object.keys(TAG_CLASSES).filter(t => lower.includes('#' + t));
}

// Strips inline "#habit"-style tokens out of the displayed note body — the
// chip already shows the tag, so the text itself doesn't need to repeat it.
function stripInlineTags(text) {
  let out = text || '';
  Object.keys(TAG_CLASSES).forEach(t => {
    const re = new RegExp('#' + t.replace('-', '\\-') + '\\b', 'gi');
    out = out.replace(re, '');
  });
  return out.replace(/\s+/g, ' ').trim();
}

function noteEditor(n) {
  return `
  <div class="note" style="flex-direction:column;gap:8px;border-color:rgba(69,196,255,.35)">
    <div class="row" style="gap:8px;width:100%">
      <input id="noteEditInput" type="text" style="flex:1" value="${esc(n.text)}" data-enter="saveNoteEdit">
      <div class="btn primary" data-click="saveNoteEdit">Save</div>
      <div class="btn" data-click="cancelNoteEdit">Cancel</div>
    </div>
    <div class="quicktags">
      <span class="muted" style="font-size:10px">game:</span>
      ${[1, 2, 3, 4, 5].map(g => `<span class="chip game ${ui.editingGame === g ? 'active' : ''}" data-click="pickEditGame" data-arg="${g}">G${g}</span>`).join('')}
      <span class="muted" style="font-size:10px;margin-left:8px">tags:</span>
      ${Object.keys(TAG_CLASSES).map(t => `<span class="chip ${TAG_CLASSES[t]} ${ui.editingTags.includes(t) ? 'active' : ''}" data-click="toggleEditTag" data-arg="${t}">#${t}</span>`).join('')}
    </div>
  </div>`;
}
function tagChip(t) {
  const cls = { habit: 'habit', adapt: 'adapt', 'work-on': 'workon', tech: 'tech' }[t] || 'habit';
  return `<span class="chip ${cls}">#${t}</span>`;
}

// Which game a note added right now would land on: an explicit pick beats
// the live default (the game being played / just finished); on a past match
// no pick means a whole-match note.
function composerGameFor(live) {
  return ui.composerGame ?? (live ? (S.data.recording.currentGame || 1) : null);
}

function gameChips(m, live, selected, action) {
  const played = (m ? (m.gamesWon || 0) + (m.gamesLost || 0) : 0);
  const count = Math.min(5, Math.max(3, played, live ? (S.data.recording.currentGame || 1) : 0, selected || 0));
  return Array.from({ length: count }, (_, i) => i + 1)
    .map(g => `<span class="chip game ${selected === g ? 'active' : ''}" data-click="${action}" data-arg="${g}">G${g}</span>`)
    .join('');
}

function composer(m, live = true) {
  const tags = ['habit', 'adapt', 'work-on', 'tech'];
  const game = composerGameFor(live);
  return `
  <div class="composer">
    <div class="composer-row" ${live ? '' : 'style="border-color:rgba(255,255,255,.14)"'}>
      <span class="note-ts" ${game || live ? '' : 'style="background:rgba(255,255,255,.06);color:#6d7694"'}>${game ? 'G' + game : 'match'}</span>
      <input id="noteInput" type="text" placeholder="${live ? 'What just happened…' : 'Review note — pick a game below, or leave it on the whole match…'}" data-enter="addNote">
      <div class="btn primary" data-click="addNote">Add</div>
    </div>
    <div class="quicktags">
      <span class="muted" style="font-size:10px">game:</span>
      ${gameChips(m, live, game, 'pickComposerGame')}
      ${live ? '' : '<span class="muted" style="font-size:9.5px">(click again for whole match)</span>'}
      <span class="muted" style="font-size:10px;margin-left:8px">quick-tag:</span>
      ${tags.map(t => `<span class="chip ${TAG_CLASSES[t]} ${ui.activeTags.includes(t) ? 'active' : ''}" data-click="toggleTag" data-arg="${t}">#${t}</span>`).join('')}
    </div>
  </div>`;
}

function scoutingPanel(opponent, s) {
  const past = s.matches.filter(m => m.opponent.toLowerCase() === opponent.toLowerCase() && m.result);
  const wins = past.filter(m => m.result === 'W').length;
  const losses = past.filter(m => m.result === 'L').length;
  const habits = [];
  s.matches.filter(m => m.opponent.toLowerCase() === opponent.toLowerCase())
    .forEach(m => m.notes.forEach(n => { if ((n.tags || []).includes('habit')) habits.push(n); }));
  const plan = s.gamePlans[opponent.toLowerCase()] || '';
  return `
  <div class="row" style="gap:6px"><span class="slabel">SCOUTING</span></div>
  <div class="row" style="gap:8px">
    <div class="stat-box"><div class="stat-num" style="color:${losses > wins ? '#ff8f8f' : '#7fe8ad'}">${wins}–${losses}</div><div class="stat-lbl">sets vs you</div></div>
  </div>
  <div class="col" style="gap:8px">
    <div class="slabel" style="color:#ff9dc4;font-size:10px">HABITS</div>
    ${habits.length === 0 ? '<div class="muted" style="font-size:11px">Tag a note #habit to start building this.</div>' :
      habits.slice(0, 5).map(h => `<div class="habit-line">${esc(stripInlineTags(h.text))}</div>`).join('')}
  </div>
  <div class="plan-box">
    <div class="plan-label">GAME PLAN</div>
    <div class="plan-text">${plan ? esc(plan) : '<span class="muted">No game plan yet — add one from the player page.</span>'}</div>
  </div>
  <div class="col" style="gap:6px;margin-top:auto">
    <div class="slabel" style="font-size:10px">PAST SETS</div>
    ${past.length === 0 ? '<div class="muted" style="font-size:10.5px">No finished sets recorded yet.</div>' :
      past.slice(0, 4).map(m => `<div class="row" style="justify-content:space-between;font:400 10.5px Sora,sans-serif;color:#a9b2cc"><span>${fmtDate(m.startedAt)}</span><span class="${m.result === 'W' ? '' : ''}" style="color:${m.result === 'W' ? '#3ddc84' : '#ff6d6d'};font-weight:700">${m.result} ${m.gamesWon}–${m.gamesLost}</span></div>`).join('')}
  </div>`;
}

// ================= PLAYER PAGE (turn 2b) =================

function renderPlayer(s) {
  const opponent = s.playerName;
  const matches = s.matches.filter(m => m.opponent.toLowerCase() === (opponent || '').toLowerCase());
  const finished = matches.filter(m => m.result);
  const wins = finished.filter(m => m.result === 'W').length;
  const losses = finished.filter(m => m.result === 'L').length;
  const gamesWon = finished.reduce((a, m) => a + (m.gamesWon || 0), 0);
  const gamesLost = finished.reduce((a, m) => a + (m.gamesLost || 0), 0);
  const notesCount = matches.reduce((a, m) => a + m.notes.length, 0);
  const habits = [];
  matches.forEach(m => m.notes.forEach(n => { if ((n.tags || []).includes('habit')) habits.push(n); }));
  const plan = s.gamePlans[(opponent || '').toLowerCase()] || '';

  const stageMap = {};
  matches.forEach(m => (m.stages || []).forEach(st => {
    stageMap[st] = stageMap[st] || { w: 0, l: 0 };
    if (m.result === 'W') stageMap[st].w++; else if (m.result === 'L') stageMap[st].l++;
  }));

  return `
  <div class="main" style="width:100%">
    <div class="player-hdr">
      <span class="link" data-click="openLibrary">← Library</span><span class="muted">/</span><span style="font:600 12px Sora,sans-serif;color:#a9b2cc">Players</span>
      <span style="margin-left:auto;font:600 13px Sora,sans-serif">${esc(opponent)}</span>
    </div>
    <div class="player-who">
      <div class="avatar">${initial(opponent)}</div>
      <div class="col" style="gap:3px">
        <div style="font:800 19px Sora,sans-serif">${esc(opponent)}</div>
        <div class="muted" style="font-size:11px">${matches.length} recorded match${matches.length === 1 ? '' : 'es'}</div>
      </div>
      <div class="row" style="margin-left:auto;gap:10px">
        <div class="stat-box"><div class="stat-num" style="color:${losses > wins ? '#ff8f8f' : '#7fe8ad'}">${wins}–${losses}</div><div class="stat-lbl">sets</div></div>
        <div class="stat-box"><div class="stat-num">${gamesWon}–${gamesLost}</div><div class="stat-lbl">games</div></div>
        <div class="stat-box"><div class="stat-num" style="color:#45c4ff">${notesCount}</div><div class="stat-lbl">notes</div></div>
      </div>
    </div>
    <div class="player-body">
      <div class="player-col left">
        <div class="row" style="gap:8px"><span class="slabel" style="color:#ff9dc4">HABITS</span><span class="muted" style="font-size:10px">pinned from #habit notes</span></div>
        ${habits.length === 0 ? '<div class="empty">No habits tagged yet.</div>' :
          habits.map(h => `<div class="habit-line" style="padding:10px 12px;background:rgba(255,77,148,.07);border:1px solid rgba(255,77,148,.22);border-radius:10px;border-left:none">${esc(stripInlineTags(h.text))}</div>`).join('')}
        <div class="row" style="gap:8px;margin-top:6px"><span class="slabel" style="color:#7fe8ad">GAME PLAN</span></div>
        <textarea id="gamePlanInput" rows="5" placeholder="Free-form game plan for ${esc(opponent)}…" data-blur="saveGamePlan">${esc(plan)}</textarea>
      </div>
      <div class="player-col">
        <div class="slabel">SET HISTORY</div>
        ${matches.length === 0 ? '<div class="empty">Nothing recorded yet.</div>' : matches.map(m => `
          <div class="set-row" data-click="openVideo" data-arg="${m.id}">
            <div class="row" style="gap:8px">
              <span style="font:600 11.5px Sora,sans-serif">${fmtDate(m.startedAt)}</span>
              <span class="muted" style="font-size:10.5px">${(m.stages || []).join(', ')}</span>
              ${m.result ? `<span class="chip ${m.result === 'W' ? 'win' : 'loss'}" style="margin-left:auto">${m.result} ${m.gamesWon}–${m.gamesLost}</span>` : '<span class="muted" style="margin-left:auto;font-size:10.5px">not scored</span>'}
            </div>
            <div class="muted" style="font-size:10px">${m.notes.length} note${m.notes.length === 1 ? '' : 's'}${m.videoPath ? ' · has video' : ''}</div>
          </div>`).join('')}
        ${Object.keys(stageMap).length ? `
          <div class="col" style="gap:6px;margin-top:auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px">
            <div class="slabel" style="font-size:10px">STAGES VS ${esc(opponent.toUpperCase())}</div>
            ${Object.entries(stageMap).map(([st, v]) => {
              const total = v.w + v.l, pct = total ? Math.round(100 * v.w / total) : 0;
              return `<div class="sbar-row"><span class="sbar-name">${esc(st)}</span><div class="sbar"><div class="sbar-fill" style="width:${pct}%;background:${pct >= 50 ? '#3ddc84' : '#ff6d6d'}"></div></div><span>${v.w}–${v.l}</span></div>`;
            }).join('')}
          </div>` : ''}
      </div>
    </div>
  </div>`;
}

// ================= LIVE MATCH =================

function renderLive(s) {
  const rec = s.recording;
  const overlay = !!s.overlay;
  const m = s.matches.find(x => x.id === rec.currentMatchRecordId);
  if (!rec.phase || !m) {
    return `
    <div class="main" style="width:100%">
      <div class="player-hdr">
        ${overlay ? '<span style="font:700 11px Sora,sans-serif;letter-spacing:.1em;color:#ff9dc4">LIVE MATCH</span>'
                  : '<span class="link" data-click="openLibrary">← Library</span><span class="muted">/</span><span style="font:600 12px Sora,sans-serif;color:#a9b2cc">Live match</span>'}
      </div>
      <div class="empty" style="margin:auto">No match in progress right now.<br>This ${overlay ? 'window opens' : 'page opens automatically'} when a match is found.</div>
    </div>`;
  }
  const opponent = m.opponent;
  const striking = rec.phase === 'striking';
  const past = s.matches.filter(x => x.id !== m.id && x.opponent.toLowerCase() === opponent.toLowerCase());
  const finished = past.filter(x => x.result);
  const wins = finished.filter(x => x.result === 'W').length;
  const losses = finished.filter(x => x.result === 'L').length;
  const habits = [];
  past.forEach(x => x.notes.forEach(n => { if ((n.tags || []).includes('habit')) habits.push(n); }));
  const plan = s.gamePlans[opponent.toLowerCase()] || '';

  const phaseChip = striking
    ? `<span class="row" style="gap:6px;background:rgba(255,209,102,.12);color:#ffd166;border-radius:6px;padding:4px 10px;font:700 11px Sora,sans-serif"><span class="dot" style="background:#ffd166;box-shadow:0 0 6px #ffd166"></span>STAGE STRIKING${overlay ? '' : ' · recording starts at game 1'}</span>`
    : `<span class="row" style="gap:10px"><span class="row" style="gap:6px;background:rgba(255,77,148,.14);color:#ff9dc4;border-radius:6px;padding:4px 10px;font:700 11px Sora,sans-serif"><span class="dot" style="background:#ff4d94;box-shadow:0 0 6px #ff4d94"></span>RECORDING</span><span class="btn danger" data-click="stopRecording">■ Stop</span></span>`;

  const sideInner = `
    <div class="col" style="gap:8px">
      <div class="slabel" style="color:#ff9dc4;font-size:10px">THEIR HABITS</div>
      ${habits.length === 0 ? '<div class="muted" style="font-size:11px">No #habit notes from earlier matches yet.</div>' :
        habits.slice(0, overlay ? 3 : 6).map(h => `<div class="habit-line">${esc(stripInlineTags(h.text))}</div>`).join('')}
    </div>
    <div class="col" style="gap:6px">
      <div class="slabel" style="color:#7fe8ad;font-size:10px">GAME PLAN</div>
      <textarea id="gamePlanInput" rows="${overlay ? 2 : 4}" placeholder="Game plan for ${esc(opponent)}…" data-blur="saveGamePlan">${esc(plan)}</textarea>
    </div>
    <div class="col" style="gap:6px;${overlay ? '' : 'margin-top:auto'}">
      <div class="slabel" style="font-size:10px">PAST SETS</div>
      ${finished.length === 0 ? '<div class="muted" style="font-size:10.5px">No finished sets recorded yet.</div>' :
        finished.slice(0, overlay ? 3 : 5).map(x => `<div class="row" style="justify-content:space-between;font:400 10.5px Sora,sans-serif;color:#a9b2cc"><span>${fmtDate(x.startedAt)}</span><span style="color:${x.result === 'W' ? '#3ddc84' : '#ff6d6d'};font-weight:700">${x.result} ${x.gamesWon}–${x.gamesLost}</span></div>`).join('')}
    </div>`;

  const notesCol = `
    <div class="notes-col" style="${overlay ? 'padding:10px 14px 12px' : ''}">
      <div class="row" style="gap:8px"><span class="slabel">MATCH NOTES</span><span class="muted" style="font-size:10.5px">${striking ? 'notes attach to game 1' : `notes attach to game ${rec.currentGame || 1}`}</span></div>
      ${m.notes.length === 0 ? '<div class="empty">Nothing yet — what do you notice?</div>' : notesList(m)}
      ${composer(m)}
    </div>`;

  return `
  <div class="main" style="width:100%">
    <div class="player-hdr" style="${overlay ? 'padding:9px 14px' : ''}">
      ${overlay ? '<span style="font:700 11px Sora,sans-serif;letter-spacing:.1em;color:#ff9dc4">LIVE MATCH</span>'
                : '<span class="link" data-click="openLibrary">← Library</span><span class="muted">/</span><span style="font:600 12px Sora,sans-serif;color:#a9b2cc">Live match</span>'}
      <span style="margin-left:auto" class="row">${phaseChip}</span>
    </div>
    <div class="player-who" style="${overlay ? 'padding:11px 14px 9px;gap:11px' : ''}">
      <div class="avatar" style="${overlay ? 'width:40px;height:40px;font-size:16px;border-radius:11px' : ''}">${initial(opponent)}</div>
      <div class="col" style="gap:3px">
        <div style="font:800 ${overlay ? '15px' : '19px'} Sora,sans-serif">vs ${overlay ? esc(opponent) : `<span class="link" style="color:inherit" title="open player page" data-click="openPlayer" data-arg="${esc(opponent)}">${esc(opponent)} <span style="color:#45c4ff;font-size:12px">↗</span></span>`}</div>
        <div class="muted" style="font-size:${overlay ? '10px' : '11px'}">${past.length === 0 ? 'first recorded match against this player' : `${past.length} recorded match${past.length === 1 ? '' : 'es'} before this one`}</div>
        ${m.myCharacter || m.opponentCharacter || (m.stages || []).length ? `
        <div class="row" style="gap:5px;flex-wrap:wrap;margin-top:2px">
          ${m.myCharacter ? `<span class="chip" style="background:rgba(255,77,148,.14);color:#ff9dc4">${esc(m.myCharacter)}</span>` : ''}
          ${m.opponentCharacter ? `<span class="chip" style="background:rgba(139,108,255,.16);color:#c3b3ff">${esc(m.opponentCharacter)}</span>` : ''}
          ${(m.stages || []).map(st => `<span class="chip" style="background:rgba(255,255,255,.07);color:#a9b2cc">${esc(st)}</span>`).join('')}
        </div>` : ''}
      </div>
      <div class="row" style="margin-left:auto;gap:${overlay ? '7px' : '10px'}">
        ${striking ? '' : `<div class="stat-box"><div class="stat-num" style="color:${rec.gamesLost > rec.gamesWon ? '#ff8f8f' : '#7fe8ad'}">${rec.gamesWon || 0}–${rec.gamesLost || 0}</div><div class="stat-lbl">this set</div></div>`}
        <div class="stat-box"><div class="stat-num" style="color:${losses > wins ? '#ff8f8f' : '#7fe8ad'}">${wins}–${losses}</div><div class="stat-lbl">sets vs you</div></div>
        <div class="stat-box"><div class="stat-num" style="color:#45c4ff">${m.notes.length}</div><div class="stat-lbl">notes</div></div>
      </div>
    </div>
    ${overlay ? `
    <div class="body" style="flex-direction:column">
      <div class="side-col" style="width:100%;flex:none;border-left:none;border-bottom:1px solid rgba(255,255,255,.07);max-height:40%;padding:10px 14px">${sideInner}</div>
      ${notesCol}
    </div>` : `
    <div class="body">
      ${notesCol}
      <div class="side-col">${sideInner}</div>
    </div>`}
  </div>`;
}

// ================= handlers =================

const handlers = {
  selectMatch(el, id) { ui.selectedMatchId = id; ui.composerGame = null; render(); },
  openPlayer(el, opponent) { post({ action: 'navigate', page: 'player', opponent }); },
  openLive() { post({ action: 'navigate', page: 'live' }); },
  openLibrary() { post({ action: 'navigate', page: 'library' }); },
  openSettings() { post({ action: 'navigate', page: 'settings' }); },
  stopRecording() { post({ action: 'stopRecording' }); },
  openVideo(el, id) { post({ action: 'openVideo', matchId: id }); },
  deleteMatch(el, id) {
    if (ui.selectedMatchId === id) ui.selectedMatchId = null;
    post({ action: 'deleteMatch', matchId: id });
  },
  openConfig() { post({ action: 'openConfig' }); },
  openLog() { post({ action: 'openLog' }); },
  toggleTag(el, tag) {
    const input = document.getElementById('noteInput');
    const text = input ? input.value : '';
    const i = ui.activeTags.indexOf(tag);
    if (i >= 0) ui.activeTags.splice(i, 1); else ui.activeTags.push(tag);
    render();
    const again = document.getElementById('noteInput');
    if (again) again.value = text;
  },
  addNote() {
    const input = document.getElementById('noteInput');
    if (!input || !input.value.trim()) return;
    const id = S.data.page === 'live'
      ? S.data.recording.currentMatchRecordId
      : pickSelectedMatch(S.data)?.id;
    if (!id) return;
    // Same "live" the composer was rendered with, so the saved game matches
    // the badge that was showing when the note was typed.
    const live = S.data.page === 'live'
      || (S.data.recording.isRecording && id === S.data.recording.currentMatchRecordId);
    const tags = Array.from(new Set([...ui.activeTags, ...parseInlineTags(input.value)]));
    post({ action: 'addNote', matchId: id, text: input.value, tags, gameNumber: composerGameFor(live) });
    ui.activeTags = [];
    ui.composerGame = null;
  },
  pickComposerGame(el, g) {
    g = Number(g);
    ui.composerGame = ui.composerGame === g ? null : g;
    render();
  },
  pickEditGame(el, g) {
    g = Number(g);
    ui.editingGame = ui.editingGame === g ? null : g;
    render();
  },
  editNote(el, id) {
    const n = S.data.matches.flatMap(m => m.notes).find(x => x.id === Number(id));
    if (!n) return;
    ui.editingNoteId = n.id;
    ui.editingTags = [...(n.tags || [])];
    ui.editingGame = n.gameNumber || null;
    render();
  },
  toggleEditTag(el, tag) {
    const input = document.getElementById('noteEditInput');
    const text = input ? input.value : '';
    const i = ui.editingTags.indexOf(tag);
    if (i >= 0) ui.editingTags.splice(i, 1); else ui.editingTags.push(tag);
    render();
    const again = document.getElementById('noteEditInput');
    if (again) again.value = text;
  },
  saveNoteEdit() {
    const input = document.getElementById('noteEditInput');
    if (!input || !input.value.trim() || ui.editingNoteId == null) return;
    const tags = Array.from(new Set([...ui.editingTags, ...parseInlineTags(input.value)]));
    post({ action: 'updateNote', noteId: ui.editingNoteId, text: input.value, tags, gameNumber: ui.editingGame });
    ui.editingNoteId = null;
    ui.editingTags = [];
    ui.editingGame = null;
  },
  cancelNoteEdit() {
    ui.editingNoteId = null;
    ui.editingTags = [];
    ui.editingGame = null;
    render();
  },
  deleteNote(el, id) {
    if (!confirm('Delete this note?')) return;
    if (ui.editingNoteId === Number(id)) { ui.editingNoteId = null; ui.editingTags = []; }
    post({ action: 'deleteNote', noteId: Number(id) });
  },
  editFocus() {
    const val = prompt('This week\'s focus:', S.data.focusGoal || '');
    if (val !== null) post({ action: 'setFocusGoal', text: val });
  },
  editMeta(el, id) {
    const m = S.data.matches.find(x => x.id === id);
    if (!m) return;
    const result = prompt('Result (W / L / blank):', m.result || '');
    if (result === null) return;
    const gw = parseInt(prompt('Games won:', m.gamesWon || 0)) || 0;
    const gl = parseInt(prompt('Games lost:', m.gamesLost || 0)) || 0;
    const stages = prompt('Stages (comma separated):', (m.stages || []).join(', ')) || '';
    const myChar = prompt('Your character:', m.myCharacter || '') || '';
    const oppChar = prompt('Opponent character:', m.opponentCharacter || '') || '';
    post({
      action: 'updateMatchMeta', matchId: id,
      result: result.trim().toUpperCase() || null, gamesWon: gw, gamesLost: gl,
      stages: stages.split(',').map(x => x.trim()).filter(Boolean),
      myCharacter: myChar.trim() || null, opponentCharacter: oppChar.trim() || null,
    });
  },
  saveGamePlan(el) {
    const opponent = S.data.page === 'live' ? S.data.recording.opponent : S.data.playerName;
    if (opponent) post({ action: 'setGamePlan', opponent, text: el.value });
  },
  saveSettings() {
    post({
      action: 'saveSettings',
      filenameTemplate: document.getElementById('cfgFilenameTemplate').value,
      recordingsFolder: document.getElementById('cfgRecordingsFolder').value,
      obsExePath: document.getElementById('cfgObsExePath').value,
    });
  },
  toggleDeleteOriginal() {
    post({ action: 'saveSettings', toggleDeleteOriginal: true });
  },
};
</script>
</body>
</html>
